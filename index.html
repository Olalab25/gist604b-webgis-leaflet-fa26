<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tempe Infrastructure Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="js/script.js"></script>
</head>
<body>
  <header>
    <h1>Tempe Infrastructure Map</h1>
    <p>Explore parks, roads, and public amenities in Tempe, Arizona.</p>
  </header>
  <div id="map" role="region" aria-label="Interactive map of Tempe"></div>
  <footer>
    <p id="status" aria-live="polite">Loading map data...</p>
  </footer>
</body>
</html>
